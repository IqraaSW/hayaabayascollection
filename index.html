<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haya Abayas Collection | Premium Abayas</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Great+Vibes&amp;family=Montserrat:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--w:#fff;--b:#111;--be:#f3ece1;--bd:#d9ccb8;--g:#6b6b6b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--w);color:var(--b);font:15px/1.7 Montserrat,'Helvetica Neue',Arial,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
a{color:inherit}.wrap{max-width:1100px;margin:auto;padding:0 20px}
header{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid var(--bd);z-index:5}
.nav{display:flex;justify-content:space-between;align-items:center;height:78px}
.logo{text-decoration:none;display:flex;flex-direction:column;align-items:center;line-height:1}.logo b{font:400 38px 'Great Vibes',cursive;color:var(--b)}.logo small{font:600 9px Montserrat,sans-serif;letter-spacing:4px;text-transform:uppercase;border-top:1px solid var(--b);padding-top:4px;margin-top:2px}
nav a{margin-left:26px;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.hero{background:var(--be);text-align:center;padding:90px 20px}
.hero h1{font-size:clamp(38px,7vw,68px);line-height:1.08;max-width:760px;margin:0 auto 16px}
.hero p{color:var(--g);max-width:560px;margin:0 auto 28px}
.btn{display:inline-block;background:var(--b);color:#fff;border:1px solid var(--b);padding:12px 26px;text-decoration:none;font:500 12px Montserrat,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.btn.o{background:transparent;color:var(--b)}.btn:hover{opacity:.85}
section{padding:70px 0}h2{font-size:42px;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:var(--g);margin:0 0 32px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:32px}
.tabs button{border:1px solid var(--bd);background:#fff;padding:8px 18px;cursor:pointer;font:inherit;font-size:14px}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px}
.card{border:1px solid var(--bd);background:#fff}
.img{aspect-ratio:3/4;background:var(--be) center/cover no-repeat;position:relative}
.tag{position:absolute;top:10px;left:10px;background:var(--b);color:#fff;font-size:11px;letter-spacing:1px;padding:3px 10px;text-transform:uppercase}
.info{padding:16px}.info small{color:var(--g);text-transform:uppercase;letter-spacing:1px;font-size:11px}
.info h3{font-size:23px;margin:2px 0 6px}.info p{margin:0 0 10px;color:var(--g);font-size:14px}
.pr{font-weight:500;margin-bottom:12px}.info .btn{width:100%;text-align:center;padding:10px}
.alt{background:var(--be)}.about{max-width:700px;margin:auto;text-align:center;color:#333}
.cts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;text-align:center}
.cts div{border:1px solid var(--bd);background:#fff;padding:24px;min-width:0;overflow-wrap:anywhere;word-break:break-word}.cts a{overflow-wrap:anywhere;font-size:14px}.cts b{display:block;font:600 11px Montserrat;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
footer{background:var(--b);color:#fff;text-align:center;padding:28px 20px;font-size:13px;letter-spacing:.5px}
.empty{text-align:center;color:var(--g);grid-column:1/-1;padding:30px}
#ab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:none}
#adm{position:fixed;inset:0;background:#0008;z-index:20;display:none;overflow:auto}
.pan{background:#fff;max-width:760px;margin:20px auto;padding:22px;border-top:4px solid var(--b)}
.pan label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:12px 0 4px}
.pan input,.pan textarea{width:100%;padding:10px;border:1px solid var(--bd);font:inherit;background:#fff}
.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd);padding:10px 0}
.row i{width:48px;height:60px;background:var(--be) center/cover;flex:none}.row span{flex:1}
.pan .btn{padding:9px 16px;margin:4px 4px 0 0}.st{color:var(--g);font-size:13px;margin-top:8px}
@media(max-width:600px){nav a:not(:last-child){display:none}.hero{padding:60px 20px}}
.hero{background-size:cover!important}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));text-align:center;border-bottom:1px solid var(--bd)}
.trust div{padding:18px;font:500 11px Montserrat,sans-serif;letter-spacing:2px;text-transform:uppercase}
.srch{max-width:420px;margin:0 auto 22px}.srch input{width:100%;padding:12px 16px;border:1px solid var(--bd);font:inherit}
.card{cursor:pointer;transition:box-shadow .2s}.card:hover{box-shadow:0 8px 24px #0001}
s{color:var(--g);font-size:13px;margin-left:6px}
#md{position:fixed;inset:0;background:#000a;z-index:15;display:none;overflow:auto}
.mb{background:#fff;max-width:900px;margin:30px auto;padding:24px;position:relative}
.x{position:absolute;right:16px;top:10px;cursor:pointer;font-size:20px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:28px}.mg h2{font-size:34px;margin:2px 0 8px}
.th{display:flex;gap:8px;margin-top:8px}.th i{width:64px;height:80px;background:var(--be) center/cover;cursor:pointer;border:1px solid var(--bd)}
.lb{font-size:11px;letter-spacing:2px;text-transform:uppercase;display:block;margin:14px 0 8px}
.fw{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--b);color:#fff;padding:12px 20px;text-decoration:none;font:500 12px Montserrat,sans-serif;letter-spacing:1.5px;z-index:8;border-radius:30px}
.tb{position:relative;display:inline-block;margin:6px 6px 0 0}.tb i{display:block;width:60px;height:76px;background:var(--be) center/cover}.tb a{position:absolute;top:-6px;right:-6px;background:var(--b);color:#fff;width:18px;height:18px;text-align:center;line-height:18px;border-radius:50%;cursor:pointer}
footer a{margin:0 12px;text-decoration:none;letter-spacing:2px;font-size:12px;text-transform:uppercase}footer p{margin:14px 0 0;color:#aaa}
@media(max-width:700px){.mg{grid-template-columns:1fr}}
</style></head><body>
<div id="app"></div><div id="md"></div>
<script id="data" type="application/json">{"s": {"logo": "Haya", "brand": "Haya Abayas Collection", "tagline": "Modest. Elegant. Timeless.", "heroTitle": "Elegance in Every Thread", "heroSub": "Discover our collection of beautifully crafted abayas, designed for grace and everyday comfort.", "about": "Haya Abayas Collection offers premium, thoughtfully designed abayas that blend modesty with modern style. Every piece is chosen for quality fabric, flattering fit and lasting comfort.", "wa": "03430661272", "phone": "", "email": "hayaabayascollection6@gmail.com", "addr": "Hyderabad, Sindh", "ig": "hayaabayascollection", "cur": "PKR", "t1": "Premium Quality Fabric", "t2": "Order Easily on WhatsApp", "t3": "Elegant Modest Designs", "policy": "Orders are confirmed through WhatsApp. Delivery details and charges are shared when you place your order.", "heroImg": ""}, "p": []}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
let D=JSON.parse(document.getElementById('data').textContent),cat='All';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cats(){return ['All',...new Set(D.p.map(p=>p.c).filter(Boolean))]}
const IM=p=>p.imgs||(p.img?[p.img]:[]);let q='',sz='',ti=[];
const pr=p=>{const c=esc(D.s.cur);return p.sp?`${c} ${esc(p.sp)} <s>${c} ${esc(p.pr)}</s>`:`${c} ${esc(p.pr)}`};
function gh(){return D.p.filter(p=>(cat=='All'||p.c==cat)&&(!q||(p.n+' '+p.c).toLowerCase().includes(q))).map(card).join('')||'<div class="empty">New collection coming soon.</div>'}
function grid(){$('#gr').innerHTML=gh()}
function card(p){const im=IM(p);return `<div class="card" onclick="openP(${p.id})"><div class="img" style="${im[0]?`background-image:url(${im[0]})`:''}">${p.out?'<span class="tag">Sold Out</span>':p.nw?'<span class="tag">New</span>':''}</div><div class="info"><small>${esc(p.c)}</small><h3>${esc(p.n)}</h3><div class="pr">${pr(p)}</div><span class="btn o">View Details</span></div></div>`}
function render(){const s=D.s;document.title=s.brand+' | Premium Abayas';
$('#app').innerHTML=`<header><div class="wrap nav"><a class="logo" href="#top"><b>${esc(s.logo||s.brand.split(" ")[0])}</b><small>${esc(s.brand.split(" ").slice(1).join(" "))}</small></a><nav><a href="#shop">Shop</a><a href="#about">About</a><a href="#contact">Contact</a></nav></div></header>
<div class="hero" id="top" style="${s.heroImg?`background:linear-gradient(#ffffffb8,#ffffffb8),url(${s.heroImg}) center/cover`:''}"><h1>${esc(s.heroTitle)}</h1><p>${esc(s.heroSub)}</p><a class="btn" href="#shop">Shop Collection</a></div>
<div class="trust">${[s.t1,s.t2,s.t3].filter(Boolean).map(t=>`<div>${esc(t)}</div>`).join('')}</div>
<section id="shop"><div class="wrap"><h2>Our Collection</h2><p class="sub">${esc(s.tagline)}</p>
<div class="srch"><input placeholder="Search abayas..." value="${esc(q)}" oninput="q=this.value.toLowerCase();grid()"></div>
<div class="tabs">${cats().map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${esc(c).replace(/'/g,'')}';render()">${esc(c)}</button>`).join('')}</div>
<div class="grid" id="gr">${gh()}</div></div></section>
<section class="alt" id="about"><div class="wrap"><h2>About Us</h2><p class="about">${esc(s.about)}</p></div></section>
${s.policy?`<section><div class="wrap"><h2>Shipping &amp; Orders</h2><p class="about" style="white-space:pre-line">${esc(s.policy)}</p></div></section>`:''}
<section class="alt" id="contact"><div class="wrap"><h2>Contact Us</h2><p class="sub">We would love to hear from you</p><div class="cts">
${s.wa?`<div><b>WhatsApp</b><a href="https://wa.me/${esc(s.wa)}" target="_blank">Chat with us</a></div>`:''}${s.phone?`<div><b>Phone</b>${esc(s.phone)}</div>`:''}${s.email?`<div><b>Email</b><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></div>`:''}${s.ig?`<div><b>Instagram</b><a href="https://instagram.com/${esc(s.ig.replace('@',''))}" target="_blank">${esc(s.ig)}</a></div>`:''}${s.addr?`<div><b>Address</b>${esc(s.addr)}</div>`:''}</div></div></section>
<footer><a href="#shop">Shop</a><a href="#about">About</a><a href="#contact">Contact</a><p>&copy; ${new Date().getFullYear()} ${esc(s.brand)}. All rights reserved.</p></footer>${s.wa?`<a class="fw" target="_blank" href="https://wa.me/${esc(s.wa)}">Chat on WhatsApp</a>`:''}`}
function openP(id){const p=D.p.find(x=>x.id==id);if(!p)return;sz='';const im=IM(p),S=(p.sz||'').split(',').map(x=>x.trim()).filter(Boolean);
$('#md').innerHTML=`<div class="mb"><a class="x" onclick="$('#md').style.display='none'">✕</a><div class="mg"><div><div class="img" id="mi" style="${im[0]?`background-image:url(${im[0]})`:''}"></div><div class="th">${im.map((x,i)=>`<i style="background-image:url(${x})" onclick="gal(${id},${i})"></i>`).join('')}</div></div>
<div><small>${esc(p.c)}</small><h2>${esc(p.n)}</h2><div class="pr" style="font-size:18px">${pr(p)}</div><p style="white-space:pre-line;color:#444">${esc(p.d)}</p>
${S.length?`<b class="lb">Select Size</b><div class="tabs" style="justify-content:flex-start">${S.map(x=>`<button onclick="sz=this.textContent;document.querySelectorAll('#md .tabs button').forEach(b=>b.classList.toggle('on',b==this))">${esc(x)}</button>`).join('')}</div>`:''}
${p.out?'<span class="btn o">Sold Out</span>':`<a class="btn" target="_blank" rel="noopener" onclick="return ord(this,${id},${S.length})">Order on WhatsApp</a>`}</div></div></div>`;$('#md').style.display='block'}
function gal(id,i){$('#mi').style.backgroundImage='url('+IM(D.p.find(x=>x.id==id))[i]+')'}
function ord(a,id,n){const p=D.p.find(x=>x.id==id);if(!D.s.wa){alert('Please contact us via the details below.');return false}if(n&&!sz){alert('Please select a size');return false}
a.href='https://wa.me/'+D.s.wa+'?text='+encodeURIComponent(`Hello, I would like to order: ${p.n}${sz?' - Size '+sz:''} (${D.s.cur} ${p.sp||p.pr})`);return true}
(async()=>{render();try{const sb=supabase.createClient(SB_URL,SB_KEY),[a,b]=await Promise.all([sb.from('settings').select('data').eq('id',1).maybeSingle(),sb.from('products').select('*').order('created_at',{ascending:false})]);
if(a.data&&a.data.data)Object.assign(D.s,a.data.data);D.p=(b.data||[]).map(r=>({id:r.id,n:r.name,pr:r.price,sp:r.sale_price,c:r.category,sz:r.sizes,d:r.description,imgs:r.images||[],nw:r.is_new,out:r.sold_out}));render()}catch(x){console.error(x)}})();
</script></body></html>
